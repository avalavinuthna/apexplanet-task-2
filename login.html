<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-5">
    <div class="form-box">

        <h2>Login</h2>

        <form>
            <input type="email" class="form-control mb-3" placeholder="Enter Email" required>

            <input type="password" id="loginPassword" class="form-control mb-3" placeholder="Enter Password" required>

            <input type="checkbox" onclick="toggleLoginPassword()">
            Show Password

            <br><br>

            <button class="btn btn-primary w-100">
                Login
            </button>
        </form>

    </div>
</div>

<script src="script.js"></script>

</body>
</html>
